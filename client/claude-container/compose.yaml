name: io-claude

services:
  gateway:
    image: alpine:3.21.3
    container_name: io-claude-gateway
    hostname: io-claude-gateway
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt:
      - no-new-privileges:true
    environment:
      SOCKS_HOST: ${SOCKS_HOST:?The wrapper must provide the Docker Desktop host address}
      SOCKS_PORT: "18081"
    volumes:
      - ./gateway-entrypoint.sh:/usr/local/bin/gateway-entrypoint.sh:ro
      - ./redsocks.conf.template:/etc/redsocks.conf.template:ro
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache redsocks iptables gettext && exec /usr/local/bin/gateway-entrypoint.sh
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/net/ip_tables_names && pgrep redsocks >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  runner:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: "${CLAUDE_CODE_VERSION:-2.1.319}"
    image: io-claude-runner:${CLAUDE_CODE_VERSION:-2.1.319}
    profiles: ["build-only"]
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
    entrypoint: ["claude"]

volumes:
  claude-state:
    name: io-claude-state
